<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Transparent background, simple elegant shape -->
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  
  <!-- Outer glowing circle or wave pattern -->
  <circle cx="256" cy="256" r="220" fill="url(#indigoGrad)" />
  
  <!-- Soundwave / Speech icon in the center -->
  <g transform="translate(128, 128) scale(0.5)" fill="#ffffff">
    <!-- Mic or soundwave peaks -->
    <rect x="64" y="160" width="48" height="192" rx="24" />
    <rect x="144" y="96" width="48" height="320" rx="24" />
    <rect x="224" y="32" width="48" height="448" rx="24" />
    <rect x="304" y="128" width="48" height="256" rx="24" />
    <rect x="384" y="192" width="48" height="128" rx="24" />
  </g>
</svg>
